<script>
const D=JSON.parse(document.getElementById('data').textContent);
const NA='<span class="mut">unavailable</span>';
const gbp=v=>v==null?NA:(v<0?'−':'')+'£'+Math.abs(v).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const sg=v=>v==null?NA:`<span class="${v<0?'dn':'up'}">${v<0?'':'+'}${gbp(v)}</span>`;
const pc=v=>v==null?NA:`<span class="${v<0?'dn':'up'}">${v<0?'−':'+'}${Math.abs(v).toFixed(2)}%</span>`;
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/\*(.+?)\*/g,'<i>$1</i>');
function md(t){if(!t)return NA;const L=t.split('\n');let h='',i=0;while(i<L.length){let l=L[i];
 if(/^\|/.test(l)){let rows=[];while(i<L.length&&/^\|/.test(L[i])){rows.push(L[i]);i++}
  rows=rows.filter(r=>!/^\|\s*-/.test(r)).map(r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));
  h+='<table><tr>'+rows[0].map(c=>`<th>${inl(c)}</th>`).join('')+'</tr>'+rows.slice(1).map(r=>'<tr>'+r.map(c=>`<td>${inl(c)}</td>`).join('')+'</tr>').join('')+'</table>';continue}
 if(/^### /.test(l)){h+=`<h3>${inl(l.slice(4))}</h3>`;i++;continue}
 if(/^\s*(- |\d+\. )/.test(l)){const ol=/^\s*\d/.test(l);let it=[];while(i<L.length&&L[i].trim()){if(/^\s*(- |\d+\. )/.test(L[i]))it.push(L[i].replace(/^\s*(- |\d+\. )/,''));else it[it.length-1]+=' '+L[i].trim();i++}
  h+=(ol?'<ol>':'<ul>')+it.map(x=>`<li>${inl(x)}</li>`).join('')+(ol?'</ol>':'</ul>');continue}
 if(l.trim()){let p=[];while(i<L.length&&L[i].trim()&&!/^(\||### |\s*- |\s*\d+\. )/.test(L[i])){p.push(L[i]);i++}h+=`<p>${inl(p.join(' '))}</p>`;continue}i++}return h}
const p=D.pot,a=D.advice;
const dt=new Date(D.as_of+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
document.getElementById('app').innerHTML=`
<div class="card" id="hl"><h2>This week's trades</h2><div class="mut">From ${esc(a.title)}</div>
${(a.actions||[]).length?a.actions.map(x=>`<div class="act"><span class="tag ${x.action}">${x.action}</span><b>${esc(x.ticker)}</b> × ${esc(x.qty)} at ${esc(x.price)} · ${esc(x.limit)} · cost ${esc(x.cost)} · <b>${esc(x.timing||'timing not stated')}</b>${x.sleeve?` <span class="mut">(${esc(x.sleeve)})</span>`:''}</div>`).join(''):'<div class="act"><b>No trades this week</b></div>'}
<div class="mut">Research notes, not advice — you place any orders yourself.</div></div>
<h1>AJ Bell SIPP</h1><div class="mut">As of <b>${dt}</b> closing prices · GBP/USD ${p.fx_gbpusd??'unavailable'}</div>
<div class="card"><div class="big">${gbp(p.total)}</div><div>Invested ${gbp(p.invested)} · Cash ${gbp(p.cash)}</div>
<div class="grid" style="margin-top:12px">${D.changes.map(c=>`<div class="k"><div class="mut">${c.label}${c.span?' · since '+esc(c.span):''}</div>
<div style="font-size:18px">${sg(c.change)} ${pc(c.pct)}</div>${c.adjusted?`<div class="mut">${esc(c.adjusted)}</div>`:''}</div>`).join('')}</div></div>
<div class="card"><h2>Day, week and month moves – last month</h2>${D.chart_png?`<img src="${D.chart_png}" alt="Line chart of day, 1-week and 1-month % moves" style="width:100%;height:auto">`:NA}
<div class="mut">${D.series.length} dates (${D.series.length?esc(D.series[0].date)+' to '+esc(D.series[D.series.length-1].date):''}). % of the anchor-day pot, adjusted for contributions/transfers (8 Oct L&amp;G transfer). A line starts only where enough history exists.</div></div>
<div class="card"><h2>Holdings</h2><table><tr><th>Holding</th><th class="n">Qty</th><th class="n">Price</th><th class="n">Value</th><th class="n">Day</th><th class="n">Weight</th></tr>
${D.holdings.map(h=>`<tr><td><b>${h.ticker}</b> <span class="mut">${esc(h.name)}</span></td><td class="n">${h.qty}</td><td class="n">${h.price??NA}</td><td class="n">${gbp(h.value)}</td><td class="n">${sg(h.day_change)}</td><td class="n">${h.weight==null?NA:h.weight.toFixed(2)+'%'}</td></tr>`).join('')}
<tr><td><b>Cash</b></td><td></td><td></td><td class="n">${gbp(p.cash)}</td><td></td><td class="n">${(p.cash/p.total*100).toFixed(2)}%</td></tr></table>
<div class="mut">Values are quantity × closing price (US converted at the GBP/USD rate above); they sum to ${gbp(D.holdings_check.sum_of_values)} vs invested ${gbp(D.holdings_check.invested_in_history)}.</div></div>
<div class="card"><h2>Sleeves vs targets</h2><table><tr><th>Sleeve</th><th class="n">Value</th><th class="n">Actual</th><th class="n">Target</th><th style="width:35%"></th></tr>
${D.sleeves.map(s=>`<tr><td>${{tracker:'Global tracker (VWRP)',gilts:'Gilts (IGLS)',gold:'Gold (SGLN)',picks:'Share picks',cash:'Cash'}[s.sleeve]}</td><td class="n">${gbp(s.value)}</td><td class="n">${s.actual_pct.toFixed(1)}%</td><td class="n">${s.target_pct==null?'—':s.target_pct+'%'}</td>
<td><div class="bar"><i style="width:${Math.min(s.actual_pct,100)}%"></i>${s.target_pct!=null?`<b style="left:${s.target_pct}%"></b>`:''}</div></td></tr>`).join('')}</table>
<div class="mut">Black marker = target. Cash is being deployed into the tracker in tranches.</div></div>
<div class="card"><h2>Diary – next 3 weeks</h2>${D.diary.length?'<ul>'+D.diary.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>':NA}<div class="mut">From the ${esc(D.diary_source)}.</div></div>
<div class="card md"><h2>Latest buy/sell advice</h2><div class="mut">${esc(a.title)} · report date ${a.date??'unavailable'}</div>
<h3>Action block</h3>${md(a.tldr)}${md(a.tickets)}
<h3>Verdict on every holding</h3><table><tr><th>Holding</th><th>Verdict</th><th>Reasoning</th></tr>${a.verdicts.map(v=>`<tr><td>${esc(v.holding)}</td><td class="v">${esc(v.verdict)}</td><td>${inl(v.reasoning)}</td></tr>`).join('')}</table>
<h3>Key notes</h3>${md(a.what_changed)}${md(a.next_actions)}</div>
<footer>Sources: ${esc(D.source.history)} · ${esc(D.source.report)} · holdings ${esc(D.source.holdings)} · ${esc(D.source.prices)}. Generated ${esc(D.generated)}.<br>
<b>Research notes for Ian's own decisions, not financial advice.</b> Nothing here places trades.<br>From Grok</footer>`;
