<script>
const D=JSON.parse(document.getElementById('data').textContent);
const NA='<span class="mut">unavailable</span>';
const gbp=v=>v==null?NA:(v<0?'−':'')+'£'+Math.abs(v).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const sg=v=>v==null?NA:`<span class="${v<0?'dn':'up'}">${v<0?'':'+'}${gbp(v)}</span>`;
const pc=v=>v==null?NA:`<span class="${v<0?'dn':'up'}">${v<0?'−':'+'}${Math.abs(v).toFixed(2)}%</span>`;
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/\*(.+?)\*/g,'<i>$1</i>');
function md(t){if(!t)return NA;const L=t.split('\n');let h='',i=0;while(i<L.length){let l=L[i];
 if(/^\|/.test(l)){let rows=[];while(i<L.length&&/^\|/.test(L[i])){rows.push(L[i]);i++}
  rows=rows.filter(r=>!/^\|\s*-/.test(r)).map(r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));
  h+='<table><tr>'+rows[0].map(c=>`<th>${inl(c)}</th>`).join('')+'</tr>'+rows.slice(1).map(r=>'<tr>'+r.map(c=>`<td>${inl(c)}</td>`).join('')+'</tr>').join('')+'</table>';continue}
 if(/^### /.test(l)){h+=`<h3>${inl(l.slice(4))}</h3>`;i++;continue}
 if(/^\s*(- |\d+\. )/.test(l)){const ol=/^\s*\d/.test(l);let it=[];while(i<L.length&&L[i].trim()){if(/^\s*(- |\d+\. )/.test(L[i]))it.push(L[i].replace(/^\s*(- |\d+\. )/,''));else it[it.length-1]+=' '+L[i].trim();i++}
  h+=(ol?'<ol>':'<ul>')+it.map(x=>`<li>${inl(x)}</li>`).join('')+(ol?'</ol>':'</ul>');continue}
 if(l.trim()){let p=[];while(i<L.length&&L[i].trim()&&!/^(\||### |\s*- |\s*\d+\. )/.test(L[i])){p.push(L[i]);i++}h+=`<p>${inl(p.join(' '))}</p>`;continue}i++}return h}
const p=D.pot,a=D.advice;
const dt=new Date(D.as_of+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
