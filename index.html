<script>
const D=JSON.parse(document.getElementById('data').textContent);
const NA='<span class="mut">unavailable</span>';
const gbp=v=>v==null?NA:(v<0?'−':'')+'£'+Math.abs(v).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const sg=v=>v==null?NA:`<span class="${v<0?'dn':'up'}">${v<0?'':'+'}${gbp(v)}</span>`;
const pc=v=>v==null?NA:`<span class="${v<0?'dn':'up'}">${v<0?'−':'+'}${Math.abs(v).toFixed(2)}%</span>`;
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/\*(.+?)\*/g,'<i>$1</i>');
function md(t){if(!t)return NA;const L=t.split('\n');let h='',i=0;while(i<L.length){let l=L[i];
 if(/^\|/.test(l)){let rows=[];while(i<L.length&&/^\|/.test(L[i])){rows.push(L[i]);i++}
  rows=rows.filter(r=>!/^\|\s*-/.test(r)).map(r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));
  h+='<table><tr>'+rows[0].map(c=>`<th>${inl(c)}</th>`).join('')+'</tr>'+rows.slice(1).map(r=>'<tr>'+r.map(c=>`<td>${inl(c)}</td>`).join('')+'</tr>').join('')+'</table>';continue}
 if(/^### /.test(l)){h+=`<h3>${inl(l.slice(4))}</h3>`;i++;continue}
 if(/^\s*(- |\d+\. )/.test(l)){const ol=/^\s*\d/.test(l);let it=[];while(i<L.length&&L[i].trim()){if(/^\s*(- |\d+\. )/.test(L[i]))it.push(L[i].replace(/^\s*(- |\d+\. )/,''));else it[it.length-1]+=' '+L[i].trim();i++}
  h+=(ol?'<ol>':'<ul>')+it.map(x=>`<li>${inl(x)}</li>`).join('')+(ol?'</ol>':'</ul>');continue}
 if(l.trim()){let p=[];while(i<L.length&&L[i].trim()&&!/^(\||### |\s*- |\s*\d+\. )/.test(L[i])){p.push(L[i]);i++}h+=`<p>${inl(p.join(' '))}</p>`;continue}i++}return h}
const p=D.pot,a=D.advice;
const dt=new Date(D.as_of+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
document.getElementById('app').innerHTML=`
<div class="card" id="hl"><h2>This week's trades</h2><div class="mut">From ${esc(a.title)}</div>
${(a.actions||[]).length?a.actions.map(x=>`<div class="act"><span class="tag ${x.action}">${x.status?'✅ '+x.status+' '+x.action:x.action}</span><b>${esc(x.ticker)}</b> × ${esc(x.qty)} at ${esc(x.price)} · ${esc(x.limit)} · cost ${esc(x.cost)} · <b>${esc(x.timing||'timing not stated')}</b>${x.sleeve?` <span class="mut">(${esc(x.sleeve)})</span>`:''}</div>`).join(''):'<div class="act"><b>No trades this week</b></div>'}
${a.all_filled?'<div class="act"><b>All done — no trades outstanding until the next Friday analysis.</b></div>':''}
<div class="mut">Research notes, not advice — you place any orders yourself.</div></div>
<div class="card hc"><div class="mut">AJ Bell SIPP · ${dt} closing prices</div><div class="tot">${gbp(p.total)}</div>
<div>Cash ${gbp(p.cash)} · invested ${gbp(p.invested)}</div><div style="margin-top:10px">
${D.changes.map(c=>`<div class="row"><div class="l"><b>${c.label}</b><div class="mut">${esc(c.span||'unavailable')}</div></div>
<div class="r"><div style="font-size:17px;font-weight:700">${sg(c.change)}</div><div>${pc(c.pct)}</div></div></div>`).join('')}</div>
${D.commentary?`<p class="cm">${esc(D.commentary)}</p>`:''}</div>
<div class="card"><h2>Day, week and month moves, last month</h2>${D.chart_png?`<img src="${D.chart_png}" alt="Line chart of day, 1-week and 1-month % moves" style="width:100%;height:auto">`:NA}
<div class="mut">${D.series.length} dates (${D.series.length?esc(D.series[0].date)+' to '+esc(D.series[D.series.length-1].date):''}). % of the anchor-day pot, adjusted for contributions/transfers (8 Oct L&amp;G transfer). A line starts only where enough history exists.</div></div>
${D.sell_to_cash?`<div class="card"><h2>${esc(D.sell_to_cash.title)}</h2>
<table><tr><th>Basket</th><th class="n">Gross value</th><th class="n">Estimated costs</th><th class="n">Net cash</th></tr>
${D.sell_to_cash.groups.map(g=>`<tr><td><b>${esc(g.label)}</b><div class="mut">${esc(g.names)} · ${g.deals} deal${g.deals===1?'':'s'}</div></td><td class="n">${gbp(g.gross)}</td><td class="n">${g.costs==null?NA:gbp(g.costs)+`<div class="mut">${[g.dealing?gbp(g.dealing)+' dealing':'',g.fx?gbp(g.fx)+' FX':'',g.ptm?gbp(g.ptm)+' PTM levy':''].filter(Boolean).join(' · ')}</div>`}</td><td class="n">${gbp(g.net)}</td></tr>`).join('')}
</table>
<div class="mut">${esc(D.sell_to_cash.disclaimer)} Online dealing is £${Number(D.sell_to_cash.dealing_rate_gbp).toFixed(2)} per deal${D.sell_to_cash.frequent_dealing?' (frequent-dealer rate)':' (standard rate; £'+Number(D.sell_to_cash.frequent_rate_gbp).toFixed(2)+' if there were 10 or more share deals in the previous month)'}. US sales also pay AJ Bell's FX charge (0.75% on the first £10,000 of each deal, 0.50% on the next £10,000, 0.25% above £20,000). The PTM levy of £1.50 is included on any UK-company share deal over £10,000. Charges checked ${esc(D.sell_to_cash.checked||'date unavailable')} from ${esc(D.sell_to_cash.source_url||'AJ Bell')}${D.sell_to_cash.effective_from?`, effective from ${esc(D.sell_to_cash.effective_from)}`:''}.</div></div>`:''}
<div class="card"><h2>Holdings</h2><table><tr><th>Holding</th><th class="n">Qty</th><th class="n">Price</th><th class="n">Value</th><th class="n">Day</th><th class="n">Weight</th></tr>
${D.holdings.map(h=>`<tr><td><b>${h.ticker}</b> <span class="mut">${esc(h.name)}</span></td><td class="n">${h.qty}</td><td class="n">${h.price??NA}</td><td class="n">${gbp(h.value)}</td><td class="n">${sg(h.day_change)}</td><td class="n">${h.weight==null?NA:h.weight.toFixed(2)+'%'}</td></tr>`).join('')}
<tr><td><b>Cash</b></td><td></td><td></td><td class="n">${gbp(p.cash)}</td><td></td><td class="n">${(p.cash/p.total*100).toFixed(2)}%</td></tr></table>
