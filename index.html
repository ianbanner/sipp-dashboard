<script>
const D=JSON.parse(document.getElementById('data').textContent);
const NA='<span class="mut">unavailable</span>';
const gbp=v=>v==null?NA:(v<0?'−':'')+'£'+Math.abs(v).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const sg=v=>v==null?NA:`<span class="${v<0?'dn':'up'}">${v<0?'':'+'}${gbp(v)}</span>`;
const pc=v=>v==null?NA:`<span class="${v<0?'dn':'up'}">${v<0?'−':'+'}${Math.abs(v).toFixed(2)}%</span>`;
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/\*(.+?)\*/g,'<i>$1</i>');
function md(t){if(!t)return NA;const L=t.split('\n');let h='',i=0;while(i<L.length){let l=L[i];
 if(/^\|/.test(l)){let rows=[];while(i<L.length&&/^\|/.test(L[i])){rows.push(L[i]);i++}
  rows=rows.filter(r=>!/^\|\s*-/.test(r)).map(r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));
  h+='<table><tr>'+rows[0].map(c=>`<th>${inl(c)}</th>`).join('')+'</tr>'+rows.slice(1).map(r=>'<tr>'+r.map(c=>`<td>${inl(c)}</td>`).join('')+'</tr>').join('')+'</table>';continue}
 if(/^### /.test(l)){h+=`<h3>${inl(l.slice(4))}</h3>`;i++;continue}
 if(/^\s*(- |\d+\. )/.test(l)){const ol=/^\s*\d/.test(l);let it=[];while(i<L.length&&L[i].trim()){if(/^\s*(- |\d+\. )/.test(L[i]))it.push(L[i].replace(/^\s*(- |\d+\. )/,''));else it[it.length-1]+=' '+L[i].trim();i++}
  h+=(ol?'<ol>':'<ul>')+it.map(x=>`<li>${inl(x)}</li>`).join('')+(ol?'</ol>':'</ul>');continue}
 if(l.trim()){let p=[];while(i<L.length&&L[i].trim()&&!/^(\||### |\s*- |\s*\d+\. )/.test(L[i])){p.push(L[i]);i++}h+=`<p>${inl(p.join(' '))}</p>`;continue}i++}return h}
const p=D.pot,a=D.advice;
const dt=new Date(D.as_of+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
document.getElementById('app').innerHTML=`
<div class="card" id="hl"><h2>This week's trades</h2><div class="mut">From ${esc(a.title)}</div>
${(a.actions||[]).length?a.actions.map(x=>`<div class="act"><span class="tag ${x.action}">${x.status?'✅ '+x.status+' '+x.action:x.action}</span><b>${esc(x.ticker)}</b> × ${esc(x.qty)} at ${esc(x.price)} · ${esc(x.limit)} · cost ${esc(x.cost)} · <b>${esc(x.timing||'timing not stated')}</b>${x.sleeve?` <span class="mut">(${esc(x.sleeve)})</span>`:''}</div>`).join(''):'<div class="act"><b>No trades this week</b></div>'}
${a.all_filled?'<div class="act"><b>All done — no trades outstanding until the next Friday analysis.</b></div>':''}
<div class="mut">Research notes, not advice — you place any orders yourself.</div></div>
<div class="card hc"><div class="mut">AJ Bell SIPP · ${dt} closing prices</div><div class="tot">${gbp(p.total)}</div>
<div>Cash ${gbp(p.cash)} · invested ${gbp(p.invested)}</div><div style="margin-top:10px">
${D.changes.map(c=>`<div class="row"><div class="l"><b>${c.label}</b><div class="mut">${esc(c.span||'unavailable')}</div></div>
<div class="r"><div style="font-size:17px;font-weight:700">${sg(c.change)}</div><div>${pc(c.pct)}</div></div></div>`).join('')}</div>
${D.commentary?`<p class="cm">${esc(D.commentary)}</p>`:''}</div>
${(() => {
  const H=D.had_i_not_sold; if(!H || !H.sales || !H.sales.length) return '';
  const helped=H.gap_gbp!=null && H.gap_gbp>0, cost=H.gap_gbp!=null && H.gap_gbp<0;
  const gapClass=helped?'up':(cost?'dn':'mut');
  const gapLabel=helped?'Selling has helped':(cost?'Selling has cost':'Selling is even');
  const gapAmt=H.gap_gbp==null?NA:(H.gap_gbp===0?'£0.00':((cost?'−':'+')+'£'+Math.abs(H.gap_gbp).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2})));
  const gapPct=H.gap_pct==null?'':` <span class="${gapClass}">${H.gap_pct<0?'−':'+'}${Math.abs(H.gap_pct).toFixed(2)}%</span>`;
  const saleDiff=s=>{
    if(s.skipped) return `<span class="mut">unavailable — ${esc(s.skip_reason||'no price')}</span>`;
    if(s.difference_gbp==null) return NA;
    const saleHelped=s.difference_gbp<0, saleCost=s.difference_gbp>0;
    const cls=saleHelped?'up':(saleCost?'dn':'mut');
    const label=saleHelped?'helped':(saleCost?'cost':'even');
    const amt=(s.difference_gbp===0?'£0.00':'£'+Math.abs(s.difference_gbp).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2}));
    const pct=s.difference_pct==null?'':` (${s.difference_pct<0?'−':'+'}${Math.abs(s.difference_pct).toFixed(2)}%)`;
    return `<span class="${cls}">${label} ${amt}${pct}</span>`;
  };
  const rows=(H.sales||[]).map(s=>`<tr><td>${esc(s.date||'')}<div class="mut">${esc(s.status||'')}</div></td><td><b>${esc(s.ticker)}</b> <span class="mut">${esc(s.name||'')}</span></td><td class="n">${s.units??NA}</td><td class="n">${gbp(s.net_proceeds_gbp)}</td><td class="n">${s.skipped?NA:gbp(s.current_value_gbp)}${s.current_price_display?`<div class="mut">${esc(s.current_price_display)} on ${esc(s.current_price_date||'')}</div>`:''}</td><td class="n">${saleDiff(s)}</td></tr>`).join('');
  return `<div class="card" id="hins"><h2>Had I not sold</h2>
<div class="grid" style="margin-bottom:10px"><div class="k"><div class="mut">Actual pot</div><div style="font-size:22px;font-weight:700">${gbp(H.actual_pot)}</div></div>
<div class="k"><div class="mut">Had I not sold</div><div style="font-size:22px;font-weight:700">${H.had_i_not_sold==null?NA:gbp(H.had_i_not_sold)}</div></div>
<div class="k"><div class="mut">${gapLabel}</div><div style="font-size:22px;font-weight:700" class="${gapClass}">${H.had_i_not_sold==null?NA:gapAmt}${H.had_i_not_sold==null?'':gapPct}</div></div></div>
<table><tr><th>Sold</th><th>Holding</th><th class="n">Units</th><th class="n">Proceeds</th><th class="n">Now worth</th><th class="n">Difference</th></tr>${rows}</table>
<div class="mut">${H.complete?'':'Some sales could not be priced and were skipped rather than guessed. '}The “had I not sold” figure is the actual pot, minus the net proceeds of the sales, plus what those units would be worth at the close used above${H.fx_gbpusd!=null?` (USD names at GBP/USD ${H.fx_gbpusd} on ${esc(H.fx_date||'')})`:''}. Green means selling has helped (the pot is ahead of holding); red means it has cost. ${esc(H.note||'')}</div></div>`;
})()}
${(() => {
  const P=D.picks_vs_vwrp; if(!P) return '';
  const fmtGap=w=>{if(!w||w.gap_gbp==null) return NA; const cls=w.gap_gbp<0?'dn':(w.gap_gbp>0?'up':'mut');
    return `<span class="${cls}">${w.gap_gbp<0?'−':'+'}£${Math.abs(w.gap_gbp).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2})}</span> ${w.gap_pct==null?'':`<span class="${cls}">(${w.gap_pct<0?'−':'+'}${Math.abs(w.gap_pct).toFixed(2)}%)</span>`}`;};
  const box=w=>w?`<div class="k"><div class="mut">${esc(w.label)}<br>${esc(w.start)} to ${esc(w.end)}</div>
<div style="font-size:20px;font-weight:700">${fmtGap(w)}</div>
<div class="mut">Picks ${gbp(w.picks_end)} (${pc(w.picks_return_pct)}) vs VWRP ${gbp(w.vwrp_end)} (${pc(w.vwrp_return_pct)}) on ${gbp(w.money_in)} in</div></div>`:'';
  const months=(P.months||[]).map(w=>`<tr><td><b>${esc(w.label)}</b><div class="mut">${esc(w.start)} to ${esc(w.end)}${w.month_complete?'':' · month so far'}${w.partial_start?' · from baseline':''}</div></td><td class="n">${pc(w.picks_return_pct)}</td><td class="n">${pc(w.vwrp_return_pct)}</td><td class="n">${fmtGap(w)}</td><td>${w.behind==null?NA:(w.behind?'<span class="dn">Behind</span>':'<span class="up">Ahead</span>')}</td></tr>`).join('');
  const run=P.consecutive_months_behind;
  return `<div class="card" id="pvv"><h2>Picks vs VWRP</h2>
<div class="grid" style="margin-bottom:10px">${box(P.rolling_1m)}${box(P.since_baseline)}</div>
<p><b>Completed months behind VWRP in a row: ${run==null?NA:run}</b>${P.current_month_behind==null?'':` · this month so far: ${P.current_month_behind?'<span class="dn">behind</span>':'<span class="up">ahead</span>'}`}</p>
${months?`<table><tr><th>Month</th><th class="n">Picks</th><th class="n">VWRP</th><th class="n">Gap</th><th></th></tr>${months}</table>`:''}
<p class="mut" style="border:1px dashed var(--line);border-radius:8px;padding:8px">💡 Suggestion only: ${esc(P.proposed_rule||'')} Ian has not approved this; it is not part of the trading rules.</p>
<div class="mut">Picks are every individual share (not VWRP, IGLS, SGLN or cash), including the cash from picks sold (sold ledger). VWRP line: the picks' value at the start of each period put into VWRP at that day's close, plus each later picks buy (all-in £) put into VWRP at its own buy-day close. Gap = picks minus VWRP; % is of the VWRP figure. Yahoo closes; a ticker with a missing price is left out of both sides and listed. ${esc(P.note||'')}</div></div>`;
})()}
<div class="card"><h2>Day, week and month moves, and the pot total, last month</h2>${D.chart_png?`<img src="${D.chart_png}" alt="Three charts: day, 1-week and 1-month moves in percent and in pounds, and the daily pot total in pounds" style="width:100%;height:auto">`:NA}
<div class="mut">${D.series.length} dates (${D.series.length?esc(D.series[0].date)+' to '+esc(D.series[D.series.length-1].date):''}). Top chart is % of the anchor-day pot; middle chart is the same move in £; bottom chart is the daily pot total. Move charts are adjusted for contributions/transfers (8 Oct L&amp;G transfer). Contribution or transfer-in days are marked on the pot chart when any fall in the window. A line starts only where enough history exists.</div></div>
${D.sell_to_cash?`<div class="card"><h2>${esc(D.sell_to_cash.title)}</h2>
<table><tr><th>Basket</th><th class="n">Gross value</th><th class="n">Estimated costs</th><th class="n">Net cash</th></tr>
${D.sell_to_cash.groups.map(g=>`<tr><td><b>${esc(g.label)}</b><div class="mut">${esc(g.names)} · ${g.deals} deal${g.deals===1?'':'s'}</div></td><td class="n">${gbp(g.gross)}</td><td class="n">${g.costs==null?NA:gbp(g.costs)+`<div class="mut">${[g.dealing?gbp(g.dealing)+' dealing':'',g.fx?gbp(g.fx)+' FX':'',g.ptm?gbp(g.ptm)+' PTM levy':''].filter(Boolean).join(' · ')}</div>`}</td><td class="n">${gbp(g.net)}</td></tr>`).join('')}
</table>
<div class="mut">${esc(D.sell_to_cash.disclaimer)} Online dealing is £${Number(D.sell_to_cash.dealing_rate_gbp).toFixed(2)} per deal${D.sell_to_cash.frequent_dealing?' (frequent-dealer rate)':' (standard rate; £'+Number(D.sell_to_cash.frequent_rate_gbp).toFixed(2)+' if there were 10 or more share deals in the previous month)'}. US sales also pay AJ Bell's FX charge (0.75% on the first £10,000 of each deal, 0.50% on the next £10,000, 0.25% above £20,000). The PTM levy of £1.50 is included on any UK-company share deal over £10,000. Charges checked ${esc(D.sell_to_cash.checked||'date unavailable')} from ${esc(D.sell_to_cash.source_url||'AJ Bell')}${D.sell_to_cash.effective_from?`, effective from ${esc(D.sell_to_cash.effective_from)}`:''}.</div></div>`:''}
<div class="card"><h2>Holdings</h2><table><tr><th>Holding</th><th class="n">Qty</th><th class="n">Price</th><th class="n">Value</th><th class="n">Day</th><th class="n">Weight</th></tr>
${D.holdings.map(h=>`<tr><td><b>${h.ticker}</b> <span class="mut">${esc(h.name)}</span></td><td class="n">${h.qty}</td><td class="n">${h.price??NA}</td><td class="n">${gbp(h.value)}</td><td class="n">${sg(h.day_change)}</td><td class="n">${h.weight==null?NA:h.weight.toFixed(2)+'%'}</td></tr>`).join('')}
<tr><td><b>Cash</b></td><td></td><td></td><td class="n">${gbp(p.cash)}</td><td></td><td class="n">${(p.cash/p.total*100).toFixed(2)}%</td></tr></table>
<div class="mut">Values are quantity × closing price (US converted at the GBP/USD rate above); they sum to ${gbp(D.holdings_check.sum_of_values)} vs invested ${gbp(D.holdings_check.invested_in_history)}.</div></div>
<div class="card"><h2>Sleeves vs targets</h2><table><tr><th>Sleeve</th><th class="n">Value</th><th class="n">Actual</th><th class="n">Target</th><th style="width:35%"></th></tr>
${D.sleeves.map(s=>`<tr><td>${{tracker:'Global tracker (VWRP)',gilts:'Gilts (IGLS)',gold:'Gold (SGLN)',picks:'Share picks',cash:'Cash'}[s.sleeve]}</td><td class="n">${gbp(s.value)}</td><td class="n">${s.actual_pct.toFixed(1)}%</td><td class="n">${s.target_pct==null?'—':s.target_pct+'%'}</td>
<td><div class="bar"><i style="width:${Math.min(s.actual_pct,100)}%"></i>${s.target_pct!=null?`<b style="left:${s.target_pct}%"></b>`:''}</div></td></tr>`).join('')}</table>
<div class="mut">Black marker = target. Cash is being deployed into the tracker in tranches.</div></div>
<div class="card"><h2>Diary – next 3 weeks</h2>${D.diary.length?'<ul>'+D.diary.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>':NA}<div class="mut">From the ${esc(D.diary_source)}.</div></div>
<div class="card md"><h2>Latest buy/sell advice</h2><div class="mut">${esc(a.title)} · report date ${a.date??'unavailable'}</div>
<h3>Action block</h3>${md(a.tldr)}${md(a.tickets)}
<h3>Verdict on every holding</h3><table><tr><th>Holding</th><th>Verdict</th><th>Reasoning</th></tr>${a.verdicts.map(v=>`<tr><td>${esc(v.holding)}</td><td class="v">${esc(v.verdict)}</td><td>${inl(v.reasoning)}</td></tr>`).join('')}</table>
<h3>Key notes</h3>${md(a.what_changed)}${md(a.next_actions)}</div>
<footer>Sources: ${esc(D.source.history)} · ${esc(D.source.report)} · holdings ${esc(D.source.holdings)} · ${esc(D.source.prices)}${D.source.charges?' · '+esc(D.source.charges):''}. Generated ${esc(D.generated)}.<br>
<b>Research notes for Ian's own decisions, not financial advice.</b> Nothing here places trades.<br>From Grok</footer>`;
</script></body></html>
